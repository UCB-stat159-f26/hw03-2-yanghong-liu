[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Career match data and age-gap plots from Tennis Abstract"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas"]

[tool.setuptools.packages.find]
where = ["src"]
